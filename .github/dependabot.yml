version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      python-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      docker-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      docker-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      actions-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
