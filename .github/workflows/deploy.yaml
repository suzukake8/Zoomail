name: Build and deploy to Production Server

on:
  push:
    branches:
      - master

permissions:
  contents: read

# production タグの更新からSSHデプロイ完了までを直列化する。
concurrency:
  group: zoomail-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          # 本番VPSの uname -m は x86_64。ランナーと同じCPUなのでQEMU不要。
          platforms: linux/amd64
          load: true
          build-args: |
            APP_UID=${{ vars.APP_UID || '1000' }}
            APP_GID=${{ vars.APP_GID || '1000' }}
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Django in production image
        run: |
          docker run --rm --entrypoint python \
            -e SECRET_KEY=ci-build-check-only \
            "$IMAGE:production" manage.py check

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push checked image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:production"

  deploy:
    name: Run fixed deployment script on VPS
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debug SSH fingerprint
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          echo "=== Registered fingerprint ==="
          echo "$SSH_FINGERPRINT"

          echo "=== Server fingerprints ==="
          ssh-keyscan -p "${SSH_PORT:-22}" \
            -t ed25519,ecdsa,rsa "$SSH_HOST" 2>/dev/null \
            | ssh-keygen -lf -
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 10m
          script: sudo -n /usr/local/sbin/deploy-zoomail
