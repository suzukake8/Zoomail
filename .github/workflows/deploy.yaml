name: Build production image (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

# production タグを更新する手動ビルドを直列化する。
concurrency:
  group: zoomail-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          # 本番VPSの uname -m は x86_64。ランナーと同じCPUなのでQEMU不要。
          platforms: linux/amd64
          load: true
          build-args: |
            APP_UID=${{ vars.APP_UID || '1000' }}
            APP_GID=${{ vars.APP_GID || '1000' }}
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Django in production image
        run: |
          docker run --rm --entrypoint python \
            -e SECRET_KEY=ci-build-check-only \
            "$IMAGE:production" manage.py check

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push checked image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:production"

